<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KC">
<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<title>KC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/kalender.css">
<link rel="stylesheet" href="css/produktion.css">
<link rel="stylesheet" href="css/samling.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/uppgifter.css">
<link rel="stylesheet" href="css/manus.css">
<link rel="stylesheet" href="css/mote.css">
<link rel="stylesheet" href="css/vecka.css">
<link rel="stylesheet" href="css/mall.css">
<link rel="stylesheet" href="css/plan.css">
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><span class="logo">KC</span><span class="sync" id="sync" title="Senast hämtat · håll inne för att koppla"></span></div>
  <button class="search" id="searchBtn"><span>Sök och hoppa</span><kbd>⌘K</kbd></button>
  <div class="modebar">
    <div class="mode" role="group" aria-label="Läge"><button data-mode="jobb">Jobb</button><button data-mode="privat">Privat</button></div>
    <button class="other" id="otherToggle" title="Hur det andra läget visas"></button>
  </div>
  <nav class="nav" id="nav"></nav>
</aside>

<main id="main"><div id="view" class="view"></div></main>

<nav class="tabs" id="tabs">
  <a href="#/idag" data-v="idag">Idag<span class="badge" id="fireBadge" hidden></span></a>
  <a href="#/kalender" data-v="kalender">Kalender</a>
  <a href="#/uppgifter" data-v="uppgifter">Uppgifter</a>
  <a href="#/projekt" data-v="projekt">Projekt</a>
  <button id="moreBtn" data-v="mer">Mer</button>
</nav>

<button class="fab add" id="addBtn" aria-label="Ny">+</button>
<a class="fab claude" id="claudeBtn" aria-label="Fråga Claude" target="_blank" rel="noopener">C</a>

<div class="palette" id="palette" hidden>
  <div class="pbox">
    <input id="pInput" placeholder="Sök uppgifter, händelser, anteckningar, personer, projekt, scener…" autocomplete="off">
    <div class="presults" id="pResults"></div>
    <div class="phint"><span>↑↓ välj</span><span>↵ öppna</span><span>esc stäng</span><span>&gt; kommando</span></div>
  </div>
</div>

<script src="quotes.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
